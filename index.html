<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свадебное приглашение: Александр и Олеся</title>
    <style>
        :root {
            --bg-color: #f0ede8;
            --text-dark: #3a3530;
            --pale-warm: #e8d9c8;
            --label-gray: #a9a196;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            overflow-x: hidden;
            line-height: 1.6;
        }
        #envelope-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease-out;
        }
        .envelope-placeholder {
            width: 80%;
            max-width: 500px;
            aspect-ratio: 3/4;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid #ddd;
            color: #aaa;
            text-align: center;
            padding: 20px;
        }
        .envelope-placeholder:hover {
            transform: scale(1.03);
        }
        .envelope-placeholder::before {
            content: "📬 Нажмите, чтобы открыть приглашение";
            font-size: 1.1rem;
            margin-bottom: 12px;
        }
        #main-content {
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-out;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        #main-content.active {
            opacity: 1;
            pointer-events: all;
        }
        .image-slot {
            width: 100%;
            max-width: 900px;
            height: 450px;
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            border: 1px dashed #ccc;
            color: #bbb;
            position: relative;
        }
        .image-slot::before {
            content: attr(data-label);
            text-align: center;
            padding: 15px;
        }
        .countdown-wrapper {
            text-align: center;
            margin-top: 60px;
            padding: 20px 0;
        }
        h2.countdown-title {
            font-size: 1.8rem;
            color: var(--pale-warm);
            margin-bottom: 35px;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        h2.countdown-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background: var(--pale-warm);
            margin: 12px auto 0;
            border-radius: 1px;
        }
        .timer-grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .timer-item {
            text-align: center;
        }
        .timer-number {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1;
            font-variant-numeric: tabular-nums;
            display: block;
        }
        .timer-label {
            font-size: 0.9rem;
            color: var(--label-gray);
            text-transform: lowercase;
            margin-top: 8px;
            display: block;
        }
    </style>
</head>
<body>

    <div id="envelope-screen">
<img src="closed.jpg" alt="Закрытый конверт" class="envelope-img" onclick="openInvitation()">
    </div>

    <div id="main-content">
<img src="open.jpg" alt="Приглашение" class="section-image">
<img src="map.jpg" alt="Карта" class="section-image">

        <div class="countdown-wrapper">
            <h2 class="countdown-title">До нашей свадьбы осталось:</h2>
            <div class="timer-grid">
                <div class="timer-item">
                    <span class="timer-number" id="days">00</span>
                    <span class="timer-label">дней</span>
                </div>
                <div class="timer-item">
                    <span class="timer-number" id="hours">00</span>
                    <span class="timer-label">часов</span>
                </div>
                <div class="timer-item">
                    <span class="timer-number" id="minutes">00</span>
                    <span class="timer-label">минут</span>
                </div>
                <div class="timer-item">
                    <span class="timer-number" id="seconds">00</span>
                    <span class="timer-label">секунд</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openInvitation() {
            const envelopeScreen = document.getElementById('envelope-screen');
            const mainContent = document.getElementById('main-content');
            envelopeScreen.style.opacity = '0';
            setTimeout(() => {
                envelopeScreen.style.display = 'none';
                mainContent.classList.add('active');
                window.scrollTo(0, 0);
            }, 500);
        }

        const weddingDate = new Date("August 28, 2026 11:20:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = weddingDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (distance < 0) {
                clearInterval(timer);
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                document.querySelector('.countdown-title').innerText = "Свадьба уже состоялась! 🎉";
            }
        }, 1000);
    </script>
</body>
</html>
